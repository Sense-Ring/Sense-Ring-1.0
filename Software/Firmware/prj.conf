# Core OS Thread Allocations
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Hardware Interface Subsystems
# The PPG is driven directly over I2C in src/ppg.c: the part is a MAX30102 and
# the LED rail is gated by a load switch, neither of which the in-tree
# MAX30101 sensor driver knows about.
CONFIG_GPIO=y
CONFIG_I2C=y
# Battery sense: src/battery.c reads the switched VBAT divider off the SAADC.
CONFIG_ADC=y
# The in-tree voltage-divider sensor driver would otherwise claim the vbat node
# on sight. It only opens its power-gpios through the PM device runtime, so
# without the whole PM stack it latches the divider on at boot and never lets go
# -- which is the one thing the load switch is there to prevent. The DT node
# stays for the R5/R6 ratio; battery.c gates the switch itself.
CONFIG_VOLTAGE_DIVIDER=n
# No CONFIG_SENSOR / CONFIG_BMA4XX. The BMA530 is driven directly over I2C in
# src/imu.c for the same reason the MAX30102 is: the DTS declares the part
# "i2c-device", which claims the address and binds no driver, so there is no
# in-tree driver to enable. CONFIG_BMA4XX=y used to sit here and was a silent
# no-op -- Kconfig dropped it for an unmet devicetree dependency, so it never
# reached the generated .config at all.

# Nordic Hardware Peripheral Drivers
CONFIG_NRFX_GPIOTE=y

# Framework Options
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y

# Disable standard UART console to save power and pins
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

# Bound the application image so it cannot grow into the vitals log.
#
# There is no MCUboot, so the app links at 0x0 and the linker would otherwise
# believe it owns all 512KB -- including the `storage` partition. That was a
# theoretical problem while the log lived at 0x7a000 with 488KB of headroom in
# front of it. It stopped being theoretical when the log moved down to 0x3e000
# to take over the unused MCUboot slots: the margin is now ~57KB, and a firmware
# that quietly grew past it would have the log erasing its own code at the first
# lap. That failure is unrecoverable in the field and invisible at build time.
#
# 0x3e000 is where `storage` starts, and it is exactly the end of the old
# boot+image-0 span the app already occupied. Exceeding it is now a link error.
CONFIG_FLASH_LOAD_OFFSET=0
CONFIG_FLASH_LOAD_SIZE=0x3e000

# On-chip Flash Storage
# src/flash_store.c logs vitals packages into the "storage" partition via the
# flash map API, dumping and erasing it at boot and whenever it fills.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Bluetooth Low Energy
# src/ble.c is a connectable peripheral advertising as "SenseRing". It serves
# the standard Heart Rate (0x180D) and Battery (0x180F) services plus a custom
# vitals-package service, and notifies each on every measurement.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SenseRing"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_HRS=y
CONFIG_BT_BAS=y

# Pairing and bonding. src/ble.c gates the custom vitals and motion
# characteristics behind an encrypted link, so a wearer's readings are not
# exposed to anyone in range, and a bonded phone can auto-reconnect in the
# background (both iOS and Android lean on bonded peers for this). The ring has
# no display or keyboard, so pairing is Just Works (encrypted, unauthenticated).
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y

# One wearer, one phone: CONFIG_BT_MAX_PAIRED defaults to 1 and that is the
# right number. But with the key store full and no overwrite policy, a *new*
# phone's pairing is rejected outright -- and the ring has no way to be told to
# forget, so it would need a flash erase to ever be paired again. Overwriting
# the oldest bond makes "pair a different phone" replace the old one, which is
# the only sensible reading of the request on a single-wearer device.
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# Re-pairing the *same* phone is not free either, which an earlier version of
# the comment above got wrong. OVERWRITE_OLDEST only governs allocating a key
# slot for a peer we have no slot for; it is never reached here. When the ring
# still holds a bond and the phone has lost its side of it -- the phone was
# factory reset, the user tapped "forget", or the bond was cleared in Settings
# -- the phone opens a fresh Just Works pairing, and smp.c update_keys_check()
# refuses to let an unauthenticated bond be replaced by another unauthenticated
# pairing. The ring answers BT_SMP_ERR_AUTH_REQUIREMENTS (err 4) and the phone
# can never pair again, because the ring also has no way to be told to forget.
#
# The guard exists so an attacker who copies the phone's address cannot replace
# the bond. That protection is worth little here: Just Works is unauthenticated
# in the first place, so anyone in range can already pair as a new phone. What
# it costs, without this option, is a wearer whose ring is permanently unpairable
# after a phone reset -- recoverable only by opening the device and erasing
# flash. On a sealed device that trade is not close.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# Lets ble.c refuse a pairing instead of only being told one happened.
#
# Without this, bt_conn_auth_cb has no pairing_accept field and there is no hook
# anywhere in the host that can say no: the ring is bondable, has no I/O to
# confirm a passkey with, and therefore accepted Just Works from any central in
# range, at any time. The comment above notes in passing that "anyone in range
# can already pair as a new phone" -- this is the option that stops being true
# of.
#
# The policy it enables lives in ble.c (pairing_accept): pairable while the ring
# holds no bond, and after that only inside a two-minute window opened by a
# power-on boot. That window is also what keeps the recovery path the comment
# above is defending -- a wearer whose phone was factory reset re-pairs after a
# power cycle rather than by opening the device and erasing flash.
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y

# Replaying the buffered log (ble.c, the history characteristic) at the default
# 23-byte ATT MTU would carry one 16-byte record per notification, so a full
# buffer would cost one round trip per record. At 65 a notification holds three.
#
# The buffer is 14592 records -- the "storage" partition is 0x3a000, one page of
# which is always the erased gap ahead of the cursor -- so that is ~4864
# notifications rather than 14592. Both numbers are larger than they read here
# for a long time: the partition grew from 24KB to 232KB in the DTS and the
# comments quoting "1536 records" were never moved with it.
#
# 65 rather than the 247 maximum, deliberately. The gain is steeply
# diminishing -- 3 records per notification against 15 -- while a longer packet
# means a longer radio on-time in every connection event that carries one, and
# radio time is the budget this device has least of (ARCHITECTURE.md 5.1.1).
# Raising it further is a real lever, but it is one to pull after measuring what
# the radio actually costs, not before.
#
# The ACL buffers have to hold an MTU-sized L2CAP PDU plus its 4-byte header.
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_TX_SIZE=69
CONFIG_BT_BUF_ACL_RX_SIZE=69

# Preferred connection parameters, advertised in the GAP PPCP characteristic.
# These are the *idle* regime -- see the connection-parameter note in ble.c for
# why there are two and what moves between them. A central that reads PPCP and
# applies it lands on the same settings ble.c would have asked for, which is the
# point of setting them here as well as requesting them there.
#
# Latency 10 at a 50ms interval means the receiver listens every 550ms instead
# of every 50ms while the ring has nothing to say -- which, under
# buffer-and-flush, is nearly all the time. The numbers come from Apple's
# Accessory Design Guidelines, the strictest common central: latency <= 30,
# interval_max * (latency + 1) <= 2s, that product * 3 < timeout, timeout <= 6s.
# At 10 that is 550ms and 1.65s against a 6s timeout, so this now sits well
# inside the guideline rather than at its edge.
#
# **10 rather than 30, for link stability rather than for power.** At latency 30
# the ring may legitimately say nothing for 930ms, so a 6s supervision timeout
# leaves the central only about six chances to resynchronise before giving up.
# Measured, that drops the link repeatedly -- LINK_SUPERVISION_TIMEOUT after
# 7.4s, 24.2s, 41.0s, 54.9s and 62.6s -- each costing a full reconnect with bond
# check, encryption and service discovery. None of them is a reset: ring uptime
# and the step counter both run straight through, so only the link fails. At
# latency 10
# it speaks every 330-550ms, roughly three times as many chances inside the same
# timeout.
#
# **It is nearly free.** An empty connection event costs ~6uC, so the idle radio
# goes from ~6.5uA to ~18uA -- against a measured drain of milliamps, not a
# number worth protecting. The alternative, raising the supervision timeout,
# would breach the 6s ceiling above and risk iOS refusing the parameters.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=10
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Off because ble.c owns this policy now. The stack's version is a single
# one-shot request a few seconds after connecting, which is exactly wrong for a
# device whose link alternates between silent for minutes and a burst of
# request-response traffic: it would fire in the middle of the first backlog
# transfer and put 1.55s on every acknowledgement in it. Two owners of one
# setting is the bug; this removes the other one.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# Off, and load-bearing. Auto-reconnect works by the phone holding a standing
# request against the ring's address, so that address has to be the same one
# next boot. Privacy would rotate it behind a resolvable private address; a
# bonded central resolves that fine, but this is a deliberate no rather than a
# default nobody looked at.
CONFIG_BT_PRIVACY=n

# Persist bonds across power cycles -- in RAM only, they are lost on every
# reset, which defeats the purpose. The settings subsystem writes them through
# NVS into the dedicated "settings" partition (board DTS), kept clear of the
# vitals-log "storage" partition that flash_store.c erases on every flush.
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT_SETTINGS=y

# The die-temperature sensor driver would otherwise hold the TEMP peripheral
# that the RC low-frequency clock's calibration needs -- this board has no
# 32kHz crystal, so the SoftDevice Controller runs off the calibrated RC. No
# code reads the die temperature, so drop the driver and free TEMP.
CONFIG_TEMP_NRF5=n

# Logging Infrastructure Configuration
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_WATCHDOG=n

# Reads RESETREAS at boot so a reset can name its own cause (main.c,
# log_reset_cause). Without it an unexplained reset destroys records with
# nothing able to say why. Costs a few hundred bytes and one register read per
# boot.
#
# Note what the two options above mean for the answer: with no watchdog and no
# reset-on-fatal-error, this firmware has *almost* no software path to a reset.
#
# **Almost, and the exception below matters.** A clean fault halts, as intended.
# A fault taken with a corrupted stack pointer does not: the Cortex-M4 cannot stack the
# exception frame, escalates, and enters LOCKUP -- which resets the nRF52 in
# hardware and latches RESETREAS. So `cpu lockup` is not impossible here, it is
# the signature of exactly the failure this build could not previously see.
#
# **And `software request` is routine, not a surprise.** `west flash` ends by
# resetting the part, which sets SREQ. Every reflash prints
# it. It is only worth chasing on a boot nobody caused.
CONFIG_HWINFO=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Catch a stack overflow instead of letting it corrupt whatever is next in RAM.
#
# **Without these there is no stack-overflow detection of any kind:** no MPU, no
# stack guard, no sentinel, no asserts. An overflow silently writes into its
# neighbour and the consequences arrive later and somewhere else, which is
# indistinguishable from a hardware fault.
#
# HW_STACK_PROTECTION places an MPU guard region below each thread stack, so an
# overflow faults on the write that causes it rather than on whatever the
# corruption breaks three seconds later.
#
# **It pairs deliberately with RESET_ON_FATAL_ERROR=n above, and that pairing is
# the diagnostic.** A detected overflow *halts* rather than reboots, so the ring
# goes silent and stays silent -- which is trivially distinguishable, from the
# phone, from a reset that comes back with a new generation and t= at zero.
# Two different symptoms for two different causes, where today there is one.
#
# CONFIG_MPU_ALLOW_FLASH_WRITE (above, in the flash section) has been set all
# along and was a no-op without ARM_MPU. It stops being one here, and it is
# load-bearing: flash_store.c writes to flash from a thread context.
#
# The guard regions cost a little RAM per thread. HISTORY_STACK_SIZE is 1024
# (ble.c) and is the tightest stack in the build -- flash reads, BLE notifies
# and logging on one workqueue -- so if anything trips first it will be that,
# and that is a result rather than a regression.
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y

# 4KB of RTT up-buffer instead of the 1KB default.
#
# The default is about 13 of this firmware's log lines, and a 35-record dump
# overruns it, eating the summary line mid-write. `NO_BLOCK_SKIP` (below, and correct for a shipping build) means an
# overrun is *dropped silently* -- there is no marker, so a shredded line looks
# like a line that was never printed, and under LOG_MODE_IMMEDIATE nothing
# counts the losses either.
#
# **This raises the ceiling; it does not remove it.** A flush at a full page
# dumps 256 records and at capacity 14592, which is tens of KB -- more than this
# part has RAM for at any setting. What 4KB buys is that ordinary per-cycle
# output and a moderate dump stop colliding, which is what made the boot lines
# unreadable. Read a full-page dump expecting holes regardless.
#
# The alternative, BLOCK_IF_FIFO_FULL, is not an option: it stalls the firmware
# until a host drains the buffer, and this ring spends its life with no debugger
# attached. A ring that hangs when nobody is watching is worse than a log with
# gaps in it.
#
# Costs 3KB of RAM (59.6% -> 64.2% of the 64KB part).
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Drop log lines the RTT buffer has no room for, instead of spinning until a
# host makes room.
#
# **The default is MODE_BLOCK**, which is the opposite of the policy
# SEGGER_RTT_MODE_NO_BLOCK_SKIP above states for the same device, on the same
# buffer, for the same reason. Two owners of one question, disagreeing -- so
# both are set explicitly.
#
# What BLOCK costs here is specifically a *busy-wait*, not a sleep. Zephyr's
# backend (subsys/logging/backends/log_backend_rtt.c, on_failed_write) picks
# between k_msleep and k_busy_wait on is_sync_mode() -- and LOG_MODE_IMMEDIATE
# below makes that permanently true -- so a full buffer spins the CPU at 64MHz
# rather than sleeping. RETRY_CNT is 4 and the last iteration latches instead of
# waiting, so that is three waits of RETRY_DELAY_MS: 15ms. Under IMMEDIATE it is
# spent in whatever context called LOG_*, which on this firmware includes BLE
# callbacks, where 15ms is half a connection interval.
#
# DROP does not merely change what happens when the buffer is full -- it removes
# the wait entirely. The backend's retry_cnt is `IS_ENABLED(MODE_BLOCK) ?
# RETRY_CNT : 1`, and at 1 the first failure latches host_present false without
# ever reaching the k_busy_wait.
#
# **This is not the battery drain, and it is not being claimed as one.** The
# spin is self-limiting: host_present latches false after the first exhausted
# retry and every later write returns immediately, so an untethered ring pays it
# once. It is fixed because a firmware whose logging policy is written down
# twice should not have the two copies disagree, and because 20ms of spinning
# inside a connection event is a plausible contributor to something else.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

# Measure how much of the time the CPU is awake. See cpu_duty_report() in
# main.c for why this is the measurement that matters: with no DC/DC inductor
# the core runs from the LDO at ~7mA, and the observed ~3.3mA discharge is ~47%
# of that, while every other consumer on the board costs microamps. This is the
# only term with the right order of magnitude.
#
# THREAD_RUNTIME_STATS brings in the per-thread accounting;
# SCHED_THREAD_USAGE_ALL is what makes the whole-CPU roll-up
# (k_thread_runtime_stats_cpu_get) available rather than only per-thread
# figures. Costs two 64-bit counters per thread and a little work at every
# context switch -- which is itself a load this is measuring, so it is not free
# of the observer problem, but a few cycles per switch cannot manufacture tens
# of percent.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE_ALL=y

# Force use of internal RC oscillator instead of external 32MHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Disable high-frequency external crystal expectation
# (This varies slightly by SDK version, but this is the general approach)
CONFIG_SOC_HFXO_CAP_INTERNAL=y